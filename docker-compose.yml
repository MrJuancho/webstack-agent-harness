services:
  postgres:
    image: postgres:16-alpine
    container_name: webstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webstack_dev
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=1024m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webstack_dev"]
      interval: 2s
      timeout: 3s
      retries: 5
