name: Verify Template

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-template:
    name: verify-template.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3 # setup-uv ya no publica tag flotante de major (desde v8)

      - name: Install copier
        run: uv tool install copier

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: template/pnpm-lock.yaml

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Verify template mechanism
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/verify-template.sh
