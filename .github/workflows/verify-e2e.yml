name: Verify E2E

# Lento a propósito (Docker + Postgres real + el gauntlet completo, varios
# minutos) -- por eso no corre en cada push/PR como verify-template.yml.
# Programado + disparo manual, para que el hueco que scripts/verify-e2e.sh
# existe para cerrar no vuelva a pasar inadvertido por mucho tiempo si se
# rompe.
#
# Excepción: un PR que toca las dependencias de la plantilla (los que abre
# Dependabot, .github/dependabot.yml) SÍ lo dispara. verify-template.sh no
# instala ni corre el gauntlet, así que sin esto un bump se mergearía sin
# haber corrido nunca. En ese caso el proyecto se genera desde el checkout
# del PR (E2E_TEMPLATE_SOURCE), no desde el remoto.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]
    paths:
      - 'template/package.json'
      - 'template/pnpm-lock.yaml'
      - 'template/Dockerfile'
      - 'template/docker-compose.yml.jinja'
      - 'template/.github/workflows/**'
      - 'scripts/verify-e2e.sh'
      - '.github/workflows/verify-e2e.yml'

jobs:
  verify-e2e:
    name: verify-e2e.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3 # setup-uv ya no publica tag flotante de major (desde v8)

      - name: Install copier
        run: uv tool install copier

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: template/pnpm-lock.yaml

      - name: Install just
        uses: extractions/setup-just@v4

      # El proyecto generado exige gitleaks (doctor.sh, Gate 8 en
      # gauntlet-fast); sin esto `just setup` muere en el runner limpio
      # aunque todo pase en una máquina que ya lo tiene instalado.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install postgresql-client (pg_isready)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run end-to-end verification
        env:
          E2E_TEMPLATE_SOURCE: ${{ github.event_name == 'pull_request' && github.workspace || '' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash scripts/verify-e2e.sh
